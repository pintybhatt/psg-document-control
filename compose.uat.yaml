# UAT only: merge after compose.release.yaml. Requires Compose >= 2.24.4 (!override).
services:
  app:
    environment:
      APP_ENV: uat
      PHP_MEMORY_LIMIT: 192M
    ports: !override
      - "127.0.0.1:${DCMS_HTTP_PORT:-18084}:8080"
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.50
    pids_limit: 128
    tmpfs: !override
      - /tmp:uid=33,gid=33,mode=1770,size=64m
      - /var/www/html/bootstrap/cache:uid=33,gid=33,mode=0750,size=16m
    volumes:
      - type: bind
        source: ./docker/apache-uat.conf
        target: /etc/apache2/conf-enabled/zz-dcms-uat.conf
        read_only: true
        bind:
          create_host_path: false
  db:
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.50
    pids_limit: 256
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-storage-engine=InnoDB
      - --mysqlx=OFF
      - --innodb-dedicated-server=OFF
      - --innodb-buffer-pool-size=256M
      - --max-connections=20
      - --table-open-cache=256
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --temptable-max-ram=32M
      - --temptable-max-mmap=0
