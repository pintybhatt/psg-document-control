# Base image docker/apache.conf retains the public root and protected-path denials.
# Separate Production prefork budget: four workers, PHP 256 MiB/request, app 2 GiB.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 200
</IfModule>
KeepAlive On
MaxKeepAliveRequests 50
KeepAliveTimeout 2
Timeout 60
