# PHP Apache image uses prefork. Keep startup/config checks in the UAT checklist.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    ServerLimit 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 200
</IfModule>
KeepAlive On
MaxKeepAliveRequests 50
KeepAliveTimeout 2
Timeout 60
