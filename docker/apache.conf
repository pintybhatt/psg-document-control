ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    LimitRequestBody ${HTTP_UPLOAD_LIMIT_BYTES}
    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    <LocationMatch "^/(storage|\.env|\.git)(/|$)">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
