# Publication remains gated by the existing release-image environment switch.
name: Authorized release image
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact source already validated by this main CI run
        required: true
        type: string
      image_artifact:
        description: Same-run and same-attempt smoke-tested image archive
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-image
  cancel-in-progress: false
jobs:
  publish:
    name: publish
    if: github.event_name == 'push' && inputs.source_commit == github.sha && github.ref == 'refs/heads/main' && github.repository == 'pintybhatt/psg-document-control'
    environment: release-image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require explicit publication authorization
        env:
          ENABLED: ${{ vars.ENABLE_IMAGE_PUBLISHING }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo '::error::Image publication is disabled: ENABLE_IMAGE_PUBLISHING must be true.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact main source and archive identity
        env:
          SOURCE: ${{ inputs.source_commit }}
          ARTIFACT: ${{ inputs.image_artifact }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor "$SOURCE" origin/main
          test "$ARTIFACT" = "validated-image-$SOURCE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.image_artifact }}
          path: validated-image
      - name: Publish the exact image already built and smoke tested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source_commit }}
          VERSION: v0.0.${{ github.run_id }}-rc.${{ github.run_attempt }}
          ALLOW_INITIAL: "false"
        run: |
          repository=ghcr.io/pintybhatt/psg-document-control
          image="$repository:$VERSION-$SOURCE"
          bootstrap=()
          if [[ "$ALLOW_INITIAL" == true ]]; then bootstrap+=(--allow-initial-private); fi
          python3 docker/ghcr-policy.py --new-tag "$VERSION-$SOURCE" "${bootstrap[@]}"
          (cd validated-image && sha256sum --check image.tar.sha256)
          docker buildx version > /dev/null
          test "$(cat validated-image/source-commit.txt)" = "$SOURCE"
          image_id="$(cat validated-image/image-id.txt)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker image load --input validated-image/image.tar
          test "$(docker image inspect --format '{{.Id}}' "$image_id")" = "$image_id"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")" = "$SOURCE"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image_id")" = https://github.com/pintybhatt/psg-document-control
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$image_id" "$image"
          docker push "$image"
          python3 docker/ghcr-policy.py
          # Read this tag's registry manifest, never an arbitrary RepoDigests entry.
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' > registry-manifest.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          digest = json.loads(Path('registry-manifest.json').read_text())['digest']
          if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest):
              raise SystemExit('STOP: Invalid registry manifest digest.')
          Path('image-reference.txt').write_text('ghcr.io/pintybhatt/psg-document-control@'+digest+'\n')
          PY
          reference="$(cat image-reference.txt)"
          docker pull "$reference"
          test "$(docker image inspect --format '{{.Id}}' "$reference")" = "$image_id"
      - name: Record digest, source, migration inventory and build identity
        env:
          SOURCE: ${{ inputs.source_commit }}
          BASELINE: ${{ inputs.source_commit }}
          VERSION: v0.0.${{ github.run_id }}-rc.${{ github.run_attempt }}
          APPROVAL_REFERENCE: MAIN-CI-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 docker/release-manifest.py --image "$(cat image-reference.txt)" --source "$SOURCE" --baseline "$BASELINE" --version "$VERSION" \
            --tested-image-id "$(cat validated-image/image-id.txt)" > release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-v0.0.${{ github.run_id }}-rc.${{ github.run_attempt }}-${{ inputs.source_commit }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
